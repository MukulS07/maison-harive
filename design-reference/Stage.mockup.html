<html lang="en">
<head>

<title>King's Maison — The Chambers, Stage edition</title>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap">
<style>
body{margin:0;background:#070605;font-family:'Cormorant Garamond',Georgia,serif;color:#efe6d2}
a{color:#efe6d2;text-decoration:none}a:hover{color:#e8c77f}
.vidText{background:radial-gradient(circle at 25% 40%,#fff4d6,transparent 22%),radial-gradient(circle at 70% 60%,#ffd27a,transparent 26%),linear-gradient(110deg,#6e4414,#d9a14a 30%,#fbe7b8 45%,#a8661e 60%,#e8b55e 80%,#5a3610);background-size:240% 240%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:drift 9s ease-in-out infinite alternate}
.fade{transition:opacity 1.1s ease,transform 1.3s cubic-bezier(.2,.7,.1,1)}
.glide{transition:top 1.4s cubic-bezier(.2,.7,.1,1),transform 1.4s cubic-bezier(.2,.7,.1,1),opacity 1s ease}
.beam{transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.dust{position:absolute;border-radius:999px;background:#f3dfae;animation:float linear infinite}
.flicker{animation:flicker 5s ease-in-out infinite}
.twinkle{animation:twinkle 3.2s ease-in-out infinite}
.drip{animation:drip 2s ease-in infinite}
.chamber{transition:color .4s ease}
@keyframes drift{0%{background-position:0% 0%}50%{background-position:100% 40%}100%{background-position:30% 100%}}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-140px);opacity:0}}
@keyframes flicker{0%,100%{opacity:1}45%{opacity:.82}55%{opacity:.95}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(44px);opacity:0}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"scene":{"editor":"enum","options":["0","1","2","3"],"default":"0"},"hover":{"editor":"enum","options":["none","left","center","right"],"default":"none"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  go(step) {
    this.setState({ step: step });
    if (step === 2) {
      clearTimeout(this._t);
      this._t = setTimeout(() => this.setState({ step: 3 }), 850);
    }
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const st = this.state || {};
    const scene = st.step != null ? st.step : Number(this.props.scene || 0);
    const hover = st.hover || this.props.hover || 'none';
    const final = scene === 3;
    const angle = final ? (hover === 'left' ? -17 : hover === 'right' ? 17 : 0) : 0;
    let seed = 7;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const dust = [];
    for (let i = 0; i < 42; i++) {
      dust.push({ x: Math.round(rnd() * 1440), y: Math.round(120 + rnd() * 760), s: (1 + rnd() * 2.4).toFixed(1), dur: (8 + rnd() * 10).toFixed(1), delay: (-rnd() * 16).toFixed(1) });
    }
    const next = () => {
      const now = Date.now();
      if (this._lock && now - this._lock < 900) return;
      this._lock = now;
      if (scene < 2) this.go(scene + 1);
    };
    const prev = () => {
      const now = Date.now();
      if (this._lock && now - this._lock < 900) return;
      this._lock = now;
      if (scene === 3) this.go(1); else if (scene === 1) this.go(0);
    };
    const setHover = (h) => () => { if ((this.state || {}).hover !== h) this.setState({ hover: h }); };
    return {
      dust,
      onWheel: (e) => { if (e.deltaY > 8) next(); else if (e.deltaY < -8) prev(); },
      next,
      replay: () => this.setState({ step: 0, hover: 'none' }),
      hoverLeft: setHover('left'), hoverRight: setHover('right'), hoverCenter: setHover('center'), hoverNone: setHover('none'),
      beamsOpacity: [1, 0.45, 0.2, 0.28][scene],
      ghostOpacity: final ? 0.1 : 0,
      keyOpacity: final ? 1 : 0,
      angle,
      poolShift: Math.round(Math.tan(angle * Math.PI / 180) * 720),
      stageOpacity: final ? 1 : 0,
      stageShift: final ? 0 : 90,
      logoTop: final ? 34 : 340,
      logoScale: final ? 0.62 : 1,
      logoOpacity: scene === 0 || final ? 1 : 0,
      textOpacity: scene === 1 ? 1 : 0,
      textShift: scene === 1 ? 0 : 26,
      cueOpacity: scene <= 1 ? 1 : 0,
      cueEvents: scene <= 1 ? 'auto' : 'none',
      cueLabel: scene === 0 ? 'SCROLL TO BEGIN' : 'SCROLL',
      flashOpacity: scene === 2 ? 1 : 0,
      uiOpacity: final ? 1 : 0,
      uiEvents: final ? 'auto' : 'none',
      leftColor: hover === 'left' ? '#e8c77f' : '#efe6d2',
      rightColor: hover === 'right' ? '#e8c77f' : '#efe6d2',
      centerColor: hover === 'center' ? '#e8c77f' : '#efe6d2',
      leftLine: hover === 'left' ? 260 : 200,
      rightLine: hover === 'right' ? 260 : 200
    };
  }
}
</script>
