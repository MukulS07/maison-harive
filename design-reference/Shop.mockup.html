<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>King's Vault — The Archive, Products for Men</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap">
<style>
body{margin:0;background:#0a0806;font-family:'Cormorant Garamond',Georgia,serif;color:#efe6d2}
a{color:#efe6d2;text-decoration:none}a:hover{color:#e8c77f}
.vid{background:radial-gradient(circle at 30% 40%,rgba(255,196,110,.55),transparent 28%),radial-gradient(circle at 72% 58%,rgba(214,150,60,.45),transparent 30%),radial-gradient(circle at 50% 85%,rgba(140,70,20,.6),transparent 40%),linear-gradient(120deg,#1a1108,#3b2610 40%,#12100c 70%,#2c1c0c);background-size:220% 220%;animation:drift 16s ease-in-out infinite alternate}
.vidText{background:radial-gradient(circle at 25% 40%,#fff4d6,transparent 22%),radial-gradient(circle at 70% 60%,#ffd27a,transparent 26%),linear-gradient(110deg,#6e4414,#d9a14a 30%,#fbe7b8 45%,#a8661e 60%,#e8b55e 80%,#5a3610);background-size:240% 240%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:drift 9s ease-in-out infinite alternate}
.numeral{color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:1px rgba(201,164,92,.45)}
.chain{stroke-dasharray:6 4;animation:links 3s linear infinite}
.swing{animation:swing 7s ease-in-out infinite}
.jewel{transition:transform .35s ease}
.jewel:hover{transform:translateY(8px) scale(1.08)}
.jewel:hover .gem{box-shadow:0 0 50px rgba(255,200,110,.6)}
.tab{cursor:pointer;transition:color .25s ease}
.tab:hover{color:#e8c77f}
@keyframes drift{0%{background-position:0% 0%}50%{background-position:100% 40%}100%{background-position:30% 100%}}
@keyframes links{to{stroke-dashoffset:-40}}
@keyframes swing{0%,100%{transform:rotate(-0.6deg)}50%{transform:rotate(0.6deg)}}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; position: relative; overflow: hidden; background: #0a0806">

<div style="position: absolute; top: 0; left: 0; width: 1440px; height: 290px; overflow: hidden">
<div class="vid" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0"></div>
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(8, 6, 4, 0.72)"></div>
</div>

<header style="position: absolute; top: 0; left: 0; width: 1440px; height: 88px; box-sizing: border-box; padding: 0 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(201, 164, 92, 0.3)">
<a href="Sisters.mockup.html" style="width: 260px; display: flex; align-items: center; gap: 14px; font-size: 17px; font-style: italic">
<span style="width: 44px; height: 44px; border: 1px solid #c9a45c; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #e8c77f">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="20" y1="12" x2="4" y2="12"></line><polyline points="10 6 4 12 10 18"></polyline></svg></span>The Sisters</a>
<div style="font-family: Cinzel, Georgia, serif; font-size: 13px; letter-spacing: 0.4em; color: #c9a45c">THE ARCHIVE</div>
<div style="width: 260px; display: flex; justify-content: flex-end; align-items: center; gap: 18px">
<a href="#" aria-label="Search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg></a>
<a href="#" aria-label="Your treasury bag" style="height: 44px; display: flex; align-items: center; gap: 8px; font-family: Cinzel, Georgia, serif; font-size: 13px; letter-spacing: 0.2em"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>0</a>
</div>
</header>

<div style="position: absolute; top: 118px; left: 0; width: 1440px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="font-family: Cinzel, Georgia, serif; font-size: 13px; letter-spacing: 0.45em; color: #c9a45c">KING'S VAULT · THE SHOP</div>
<h1 class="vidText" style="margin: 0; font-family: Cinzel, Georgia, serif; font-weight: 700; font-size: 92px; line-height: 1; letter-spacing: 0.03em">Products · Men</h1>
</div>

<nav aria-label="Product sections" style="position: absolute; top: 296px; left: 172px; width: 1096px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button class="tab" onMouseEnter="{{t.pick}}" onFocus="{{t.pick}}" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="height: 48px; background: transparent; border: 0; border-bottom: 1px solid {{t.line}}; color: {{t.color}}; font-family: Cinzel, Georgia, serif; font-size: 15px; letter-spacing: 0.28em; font-weight: 600">{{t.label}}</button>
</sc-for>
</nav>
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<div style="position: absolute; top: 350px; left: {{t.ringLeft}}px; width: 12px; height: 12px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #c9a45c; background: {{t.ringFill}}; box-shadow: {{t.ringGlow}}"></div>
</sc-for>

<div class="swing" style="position: absolute; top: 0; left: 0; width: 1440px; height: 1000px; transform-origin: {{hookX}}px 356px">
<svg width="1440" height="1000" viewBox="0 0 1440 1000" aria-hidden="true" style="position: absolute; top: 0; left: 0">
<path class="chain" d="{{strandL}}" fill="none" stroke="#c9a45c" stroke-width="2" stroke-linecap="round"></path>
<path class="chain" d="{{strandR}}" fill="none" stroke="#c9a45c" stroke-width="2" stroke-linecap="round"></path>
<path class="chain" d="M260 460 Q720 820 1180 460" fill="none" stroke="#e8c77f" stroke-width="2.4" stroke-linecap="round"></path>
</svg>
<sc-for list="{{jewels}}" as="j" hint-placeholder-count="5">
<a href="#" class="jewel" style="position: absolute; left: {{j.left}}px; top: {{j.top}}px; width: 180px; display: flex; flex-direction: column; align-items: center">
<div style="width: 1px; height: 14px; background: #c9a45c"></div>
<div style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #c9a45c; margin-top: -2px"></div>
<div class="gem" style="width: {{j.size}}px; height: {{j.size}}px; box-sizing: border-box; border-radius: 999px; border: 1px solid #c9a45c; padding: 6px; background: #0a0806; transition: box-shadow .35s ease">
<div style="width: 100%; height: 100%; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(201, 164, 92, 0.4); background: radial-gradient(circle at 35% 30%, #3b2812, #120d08 70%); display: flex; align-items: center; justify-content: center">
<span class="numeral" style="font-family: Cinzel, Georgia, serif; font-size: 44px">{{j.numeral}}</span>
</div>
</div>
<div style="margin-top: 14px; font-family: Cinzel, Georgia, serif; font-size: 13px; letter-spacing: 0.18em; color: #efe6d2; text-align: center">{{j.name}}</div>
<div style="margin-top: 4px; font-size: 16px; font-style: italic; color: #c9a45c">[ PRICE ]</div>
</a>
</sc-for>
</div>

<div style="position: absolute; top: 900px; left: 0; width: 1440px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="font-size: 22px; font-style: italic; color: #d8cdb4">{{caption}}</div>
<a href="#" style="font-family: Cinzel, Georgia, serif; font-size: 12px; letter-spacing: 0.35em; color: #e8c77f; padding: 8px 0; border-bottom: 1px solid #c9a45c">SEE EVERY PIECE IN {{activeLabel}} →</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startTab":{"editor":"enum","options":["treasures","buttons","brooches","kalangi","pendant"],"default":"treasures"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const tabsDef = [
      { id: 'treasures', label: 'ALL TREASURES', caption: 'Every piece in the Vault, on one strand.' },
      { id: 'buttons', label: 'BUTTONS', caption: 'Buttons for the sherwani and the bandhgala.' },
      { id: 'brooches', label: 'BROOCHES', caption: 'Worn at the heart, over the chest.' },
      { id: 'kalangi', label: 'KALANGI', caption: 'The jewel of the turban.' },
      { id: 'pendant', label: 'PENDANTS', caption: 'Worn close, carried always.' }
    ];
    const products = {
      treasures: ['SHIELD OF LEGACY', 'ARMS OF HONOUR', 'CROWNBOUND', 'PHOENIX REIGN', 'DOMINION'],
      buttons: ['[ BUTTON I ]', '[ BUTTON II ]', '[ BUTTON III ]', '[ BUTTON IV ]', '[ BUTTON V ]'],
      brooches: ['[ BROOCH I ]', '[ BROOCH II ]', '[ BROOCH III ]', '[ BROOCH IV ]', '[ BROOCH V ]'],
      kalangi: ['[ KALANGI I ]', '[ KALANGI II ]', '[ KALANGI III ]', '[ KALANGI IV ]', '[ KALANGI V ]'],
      pendant: ['[ PENDANT I ]', '[ PENDANT II ]', '[ PENDANT III ]', '[ PENDANT IV ]', '[ PENDANT V ]']
    };
    const numerals = ['I', 'II', 'III', 'IV', 'V'];
    const active = (this.state && this.state.active) || this.props.startTab || 'treasures';
    let idx = tabsDef.findIndex(t => t.id === active);
    if (idx < 0) idx = 0;
    const hookX = 172 + 100 + idx * 224;
    const tabs = tabsDef.map((t, i) => {
      const on = i === idx;
      return {
        label: t.label,
        pressed: on ? 'true' : 'false',
        color: on ? '#e8c77f' : 'rgba(239,230,210,0.72)',
        line: on ? '#c9a45c' : 'rgba(201,164,92,0.25)',
        ringLeft: 172 + 100 + i * 224 - 6,
        ringFill: on ? '#e8c77f' : '#0a0806',
        ringGlow: on ? '0 0 18px rgba(255,200,110,0.9)' : 'none',
        pick: () => { if (this.state?.active !== t.id) this.setState({ active: t.id }); }
      };
    });
    const xs = [260, 490, 720, 950, 1180];
    const jewels = products[tabsDef[idx].id].map((name, i) => {
      const x = xs[i];
      const tt = (x - 260) / 920;
      const top = 460 + 720 * tt * (1 - tt);
      return { name, numeral: numerals[i], left: x - 90, top: Math.round(top), size: i === 2 ? 132 : 108 };
    });
    const sag = 50;
    const strandL = `M${hookX} 360 Q${(hookX + 260) / 2} ${410 + sag} 260 460`;
    const strandR = `M${hookX} 360 Q${(hookX + 1180) / 2} ${410 + sag} 1180 460`;
    return {
      tabs, jewels, hookX, strandL, strandR,
      caption: tabsDef[idx].caption,
      activeLabel: tabsDef[idx].label
    };
  }
}
</script>
</body>
</html>
